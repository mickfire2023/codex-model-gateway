name: Test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:release
      - run: npm test
      - name: Windows lifecycle and first installation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\distribution\install.test.ps1
          & .\tests\gateway\lifecycle-scheduled.test.ps1
          & .\tests\gemini\lifecycle.test.ps1
